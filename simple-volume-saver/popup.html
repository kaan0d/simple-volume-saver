<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Volume Saver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <img src="icons/low-volume-48.png" alt="" class="brand-icon">
        <h1>Volume Saver</h1>
      </div>
      <button id="themeToggle" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab-btn" id="tabBtnMain" type="button" role="tab" aria-selected="true" aria-controls="pageMain">Volume</button>
      <button class="tab-btn" id="tabBtnSites" type="button" role="tab" aria-selected="false" aria-controls="pageSites">Saved Sites</button>
    </nav>

    <section class="tab-page" id="pageMain" role="tabpanel" aria-labelledby="tabBtnMain">
      <section class="card volume-card">
        <div class="site-label-row">
          <span class="site-label" id="siteLabel">&nbsp;</span>
          <button id="removeSiteBtn" class="site-remove-btn hidden" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"></path>
              <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
            </svg>
            Remove saved
          </button>
        </div>

        <div class="wave-control" id="waveControl">
          <span id="volumeDisplay" class="volume-value-bg" aria-hidden="true">100%</span>
          <span id="waveBars" class="wave-bars" aria-hidden="true"></span>
          <div
            id="waveLine"
            class="wave-line"
            role="slider"
            tabindex="0"
            aria-label="Volume"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="100"
          >
            <span class="wave-line-arrow wave-line-arrow-up" aria-hidden="true"></span>
            <span class="wave-line-arrow wave-line-arrow-down" aria-hidden="true"></span>
          </div>
        </div>

        <div class="volume-actions">
          <button id="resetVolumeBtn" class="btn btn-ghost" type="button">Reset</button>
          <button id="addSiteBtn" class="btn btn-primary" type="button">Save site</button>
        </div>
        <p id="unsupportedNotice" class="unsupported-notice hidden">This page can't be controlled by the extension.</p>
      </section>
    </section>

    <section class="tab-page hidden" id="pageSites" role="tabpanel" aria-labelledby="tabBtnSites">
      <section class="card sites-card">
        <div class="sites-header">
          <h2>Saved sites</h2>
          <span id="siteCount" class="badge">0</span>
        </div>
        <ul id="siteList" class="site-list"></ul>
        <p id="emptyState" class="empty-state">No sites saved yet. Set a level on the Volume tab and hit&nbsp;<strong>Save site</strong>.</p>
        <div id="deleteAllRow" class="delete-all-row hidden"></div>
      </section>
    </section>

    <footer class="app-footer">
      <p class="footer-note">Mind adding a star? It helps this reach more people.</p>
      <div class="github-actions">
        <a class="btn btn-star btn-link" href="https://github.com/kaan0d/simple-volume-saver" target="_blank" rel="noopener noreferrer">
          <svg class="icon icon-star" viewBox="0 0 24 24" fill="#ffc632" stroke="#e0a300" stroke-width="1" stroke-linejoin="round">
            <polygon points="12 2 14.9 8.6 22 9.3 16.5 14 18.2 21 12 17.3 5.8 21 7.5 14 2 9.3 9.1 8.6"></polygon>
          </svg>
          Star on GitHub
        </a>
        <a class="btn btn-follow btn-link" href="https://github.com/kaan0d" target="_blank" rel="noopener noreferrer">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.8 1.2 1.8 1.2 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.7 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 2.9-.39c.98 0 1.97.13 2.9.39 2.2-1.49 3.17-1.18 3.17-1.18.64 1.59.24 2.76.12 3.05.74.8 1.19 1.83 1.19 3.09 0 4.43-2.69 5.41-5.25 5.69.41.36.78 1.06.78 2.15 0 1.55-.01 2.8-.01 3.18 0 .31.21.68.8.56A10.52 10.52 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z"></path>
          </svg>
          Follow
        </a>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
